<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Task 4.4: Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Official registration portal and event tracker for the Tech Club.">
    <meta name="keywords" content="Tech Club, Web Development, Programming, Registration, Events">
    <meta name="author" content="Student Member">
    <link rel="icon" type="image/x-icon" href="https://picsum.photos">
    <title>Tech Club Page - Week 5</title>

    <!-- Task 5.3: Import Google Font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* Task 5.4: Colors and spacing variables */
        :root {
            --bg-color-main: #f0f2f5;
            --bg-color-card: #ffffff;
            --bg-color-hero: #1e293b;
            --text-color-dark: #334155;
            --text-color-light: #ffffff;
            --accent-color: #38bdf8;
            --box-shadow-smooth: 0 4px 6px rgba(0, 0, 0, 0.05);
            
            --spacing-small: 10px;
            --spacing-medium: 20px;
            --spacing-large: 25px;
            --border-radius-base: 8px;
        }

        /* 
           Task 5.5: Color Selection Rationale
           1. I chose a slate dark gray (#1e293b) for the main headers to give the portal a professional and modern look.
           2. The soft light gray background (#f0f2f5) reduces overall screen glare and provides clean structural card grouping.
           3. Bright cyan (#38bdf8) was selected as an accent color to ensure links are eye-catching and highly visible.
        */

        /* Task 5.2: Universal Selector */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Task 5.3 & 5.4: Global Body styling */
        body {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-color-dark);
            background-color: var(--bg-color-main);
            padding-bottom: 40px;
        }

        /* Task 5.2 & 5.4: Element Selector */
        h1 {
            color: var(--text-color-light);
            margin-bottom: var(--spacing-small);
            font-size: 2rem;
            font-weight: 600;
        }

        h2 {
            font-size: 1.5rem;
            color: var(--bg-color-hero);
            margin-bottom: 15px;
        }

        /* Task 5.2 & 5.4: Id Selector */
        #hero {
            background-color: var(--bg-color-hero);
            padding: var(--spacing-large);
            text-align: center;
        }

        /* Task 5.2 & 5.4: Class Selector */
        .card {
            background-color: var(--bg-color-card);
            border-radius: var(--border-radius-base);
            padding: var(--spacing-large);
            margin: var(--spacing-medium) auto;
            max-width: 600px;
            box-shadow: var(--box-shadow-smooth);
        }

        nav ul {
            list-style: none;
        }
        nav ul li {
            display: inline;
            margin: 0 15px;
        }
        nav ul li a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        label {
            font-size: 0.95rem;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <header id="hero">
        <h1>Tech Club Portal</h1>
        <nav>
            <ul>
                <li><a href="week5.html?page=home">Home</a></li>
                <li><a href="week5.html?page=about">About</a></li>
                <li><a href="week5.html">Register</a></li>
                <li><a href="week5.html?page=contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Upcoming Club Events</h2>
            <table border="1" cellpadding="8" style="width: 100%; border-collapse: collapse; font-size: 0.95rem;">
                <thead>
                    <tr>
                        <th>Event Date</th>
                        <th>Event Title</th>
                        <th>Location</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Nov 15, 2026</td>
                        <td>Web Dev Hackathon</td>
                        <td>Lab 3</td>
                    </tr>
                    <tr>
                        <td>Dec 05, 2026</td>
                        <td>UI/UX Design Seminar</td>
                        <td>Seminar Hall A</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3">Total Scheduled Events: 2</td>
                    </tr>
                </tfoot>
            </table>
        </section>

        <section class="card">
            <h2>Registration Form</h2>
            <form action="#">
                <div>
                    <label for="username">Full Name:</label>
                    <input type="text" id="username" name="username" style="font-family: inherit;" required>
                </div>
                <br>
                <div>
                    <label for="useremail">Email Address:</label>
                    <input type="email" id="useremail" name="useremail" style="font-family: inherit;" required>
                </div>
                <br>
                <div>
                    <label for="userpassword">Password:</label>
                    <input type="password" id="userpassword" name="userpassword" style="font-family: inherit;" required>
                </div>
                <br>
                <div>
                    <label for="birthdate">Date of Birth:</label>
                    <input type="date" id="birthdate" name="birthdate" style="font-family: inherit;">
                </div>
                <br>
                <div>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" style="font-family: inherit;">
                </div>
                <br>
                <div>
                    <label>Year of Study:</label>
                    <input type="radio" id="year1" name="year" value="1st">
                    <label for="year1">1st Year</label>
                    <input type="radio" id="year2" name="year" value="2nd">
                    <label for="year2">2nd Year</label>
                </div>
                <br>
                <div>
                    <label>Interests:</label>
                    <input type="checkbox" id="interest_coding" name="interests" value="coding">
                    <label for="interest_coding">Coding</label>
                    <input type="checkbox" id="interest_design" name="interests" value="design">
                    <label for="interest_design">UI/UX Design</label>
                </div>
                <br>
                <div>
                    <label for="club_role">Preferred Role:</label>
                    <select id="club_role" name="club_role" style="font-family: inherit;">
                        <option value="member">General Member</option>
                        <option value="developer">Core Developer</option>
                        <option value="lead">Team Lead</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="comments">Why do you want to join? (Message Box):</label><br>
                    <textarea id="comments" name="comments" rows="4" style="width: 100%; font-family: inherit;"></textarea>
                </div>
                <br>
                <div>
                    <button type="submit" style="font-family: inherit; padding: 8px 16px; background-color: var(--bg-color-hero); color: var(--text-color-light); border: none; border-radius: 4px; cursor: pointer;">Submit Registration</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
