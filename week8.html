<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 - CSS Grid Layout</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 20px;
            background-color: #f5f5f5;
        }

        /* Task 8.3 Grid Container Styling with Named Areas */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 20px; 
            margin-top: 20px;
            grid-template-areas: 
                "head head head"
                "side main main"
                "foot foot foot";
        }

        /* Assigning individual grid items to named areas */
        .box-head { 
            grid-area: head; 
            background-color: #ffdde1;
        }
        .box-side { 
            grid-area: side; 
            background-color: #e2f0cb;
        }
        .box-main { 
            grid-area: main; 
            background-color: #b5ead7;
        }
        .box-foot { 
            grid-area: foot; 
            background-color: #ffdac1;
        }

        /* Task 8.4 UPDATED: Shared style using Flexbox to align icon & text side by side */
        .box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px; /* Space between icon and text */
            border: 2px solid #333;
            padding: 20px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* Placeholder icon element style */
        .icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background-color: #333;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .box-head .icon { background-color: #d94b5c; }
        .box-side .icon { background-color: #7fa844; }
        .box-main .icon { background-color: #2c8c69; }
        .box-foot .icon { background-color: #d47e43; }
    </style>
</head>
<body>

    <h2>Week 8: CSS Grid Assignment</h2>

    <!-- GRID CONTAINER (Task 8.4 Inner Flexbox) -->
    <div class="grid-container">
        <div class="box box-head">
            <span class="icon"></span>
            <span>Header Box (head)</span>
        </div>
        <div class="box box-side">
            <span class="icon"></span>
            <span>Sidebar Box (side)</span>
        </div>
        <div class="box box-main">
            <span class="icon"></span>
            <span>Main Content Box (main)</span>
        </div>
        <div class="box box-foot">
            <span class="icon"></span>
            <span>Footer Box (foot)</span>
        </div>
    </div>

</body>
</html>
