<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 - CSS Grid Layout</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 20px;
            background-color: #f5f5f5;
        }

        /* Task 8.3 Grid Container Styling with Named Areas */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 20px; 
            margin-top: 20px;
            /* Defining named grid template areas */
            grid-template-areas: 
                "head head head"
                "side main main"
                "foot foot foot";
        }

        /* Assigning individual grid items to named areas */
        .box-head { 
            grid-area: head; 
            background-color: #ffdde1;
        }
        .box-side { 
            grid-area: side; 
            background-color: #chd9ff; /* light blue tint */
            background-color: #e2f0cb;
        }
        .box-main { 
            grid-area: main; 
            background-color: #b5ead7;
        }
        .box-foot { 
            grid-area: foot; 
            background-color: #ffdac1;
        }

        /* Shared style for the boxes */
        .box {
            border: 2px solid #333;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Week 8: CSS Grid Assignment</h2>

    <!-- GRID CONTAINER (Task 8.3 Named Areas) -->
    <div class="grid-container">
        <div class="box box-head">Header Box (head)</div>
        <div class="box box-side">Sidebar Box (side)</div>
        <div class="box box-main">Main Content Box (main)</div>
        <div class="box box-foot">Footer Box (foot)</div>
    </div>

</body>
</html>
