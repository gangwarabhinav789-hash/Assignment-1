<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 - CSS Grid Layout</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 20px;
            background-color: #f5f5f5;
        }

        /* Task 8.2 UPDATED Grid Container Styling */
        .grid-container {
            display: grid;
            /* Replaced fixed 3-columns with auto-fit and minmax */
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 20px; 
            margin-top: 20px;
        }

        /* Style for the boxes inside the grid */
        .box {
            background-color: #ffffff;
            border: 2px solid #333;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Week 8: CSS Grid Assignment</h2>

    <!-- GRID CONTAINER (Task 8.1 & 8.2) -->
    <div class="grid-container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
    </div>

</body>
</html>
